name: Check public domain routing and TLS
on:
  workflow_dispatch:
permissions: {}
jobs:
  check:
    if: github.repository == 'impactional/impactional'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check authoritative DNS from outside the local network
        shell: bash
        run: |
          for ns in ns1.vercel-dns.com ns2.vercel-dns.com nsid1.rumahweb.com nsid2.rumahweb.net nsid3.rumahweb.biz nsid4.rumahweb.org; do
            echo "Nameserver: $ns"
            dig @"$ns" impactional.net A +time=3 +tries=1 +noall +answer +comments || true
            dig @"$ns" _acme-challenge.impactional.net TXT +time=3 +tries=1 +noall +answer +comments || true
          done
      - name: Check HTTP and verified HTTPS
        shell: bash
        run: |
          failed=0
          for domain in impactional.net www.impactional.net gyc.impactional.net; do
            echo "Domain: $domain"
            curl -sSI --max-time 15 "http://$domain" || true
            curl -sSI --max-time 15 "https://$domain" || failed=1
          done
          exit "$failed"
